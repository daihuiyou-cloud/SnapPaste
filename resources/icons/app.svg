<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="bgShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="mountBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7c0"/>
      <stop offset="100%" stop-color="#31c7a4"/>
    </linearGradient>
    <linearGradient id="mountFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31c7a4"/>
      <stop offset="100%" stop-color="#1fa885"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="5" y="7" width="54" height="54" rx="13" fill="#000000" opacity="0.15"/>

  <!-- Main body -->
  <rect x="4" y="5" width="56" height="56" rx="14" fill="url(#bgGrad)"/>

  <!-- Inner shine -->
  <rect x="4" y="5" width="56" height="24" rx="14" fill="url(#bgShine)"/>

  <!-- Screen area -->
  <rect x="12" y="13" width="40" height="29" rx="6" fill="url(#screenGrad)"/>

  <!-- Sky gradient overlay -->
  <rect x="12" y="13" width="40" height="18" rx="6" fill="#bae6fd" opacity="0.25"/>

  <!-- Background mountain -->
  <path d="M12 36l10-12 8 8 6-5 16 14v4H12z" fill="url(#mountBack)" opacity="0.5"/>

  <!-- Foreground mountain -->
  <path d="M12 38l14-16 10 10 8-7 8 10v4H12z" fill="url(#mountFront)"/>

  <!-- Snow cap on foreground mountain -->
  <path d="M26 22l-4 5h2l2-3 2 3h2z" fill="#fff" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="44" cy="20" r="4.5" fill="#fbbf24"/>
  <circle cx="44" cy="20" r="3" fill="#fcd34d"/>
  <circle cx="44" cy="20" r="1.5" fill="#fef3c7"/>

  <!-- Sun rays -->
  <circle cx="44" cy="20" r="6.5" fill="#fbbf24" opacity="0.12"/>
  <circle cx="44" cy="20" r="9" fill="#fbbf24" opacity="0.06"/>

  <!-- Clipboard/polaroid bottom bar -->
  <rect x="12" y="42" width="40" height="6" rx="0 0 6 6" fill="url(#barGrad)"/>

  <!-- Copy indicator dots -->
  <circle cx="20" cy="45" r="0.8" fill="#94a3b8"/>
  <circle cx="23" cy="45" r="0.8" fill="#94a3b8"/>
  <circle cx="26" cy="45" r="0.8" fill="#94a3b8"/>
  <circle cx="29" cy="45" r="0.8" fill="#94a3b8"/>

  <!-- Stand/clip -->
  <path d="M24 47.5v5c0 1.5 16 1.5 16 0v-5" fill="none" stroke="#31c7a4" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="28" y="52" width="8" height="3" rx="1.2" fill="#31c7a4"/>
</svg>